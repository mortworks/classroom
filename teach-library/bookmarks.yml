  farley-ai-150-developers-study:
    title: "We Studied 150 Developers Using AI (Here’s What's Actually Changed...)"
    speaker: "Dave Farley"
    year: "2026"
    provider: "Modern Software Engineering"
    youtube_url: "https://youtu.be/b9EbCb5A408"
    video_id: "b9EbCb5A408"
    start_time: ""
    homepage: "https://www.youtube.com/@ModernSoftwareEngineering"
    description: "Dave Farley examines research on AI-assisted coding and its impact on maintainability, design quality, and long-term software engineering discipline. Focuses on AI tools such as Claude Code, GitHub Copilot, Cursor, and ChatGPT, and the downstream effects on refactoring and system evolution."
    tags: [software-engineering, ai, maintainability, design, technical-debt, claude-code, copilot, productivity]
    notes: "Useful counterweight to hype; frames AI as amplifier of existing engineering quality rather than replacement for skill."
